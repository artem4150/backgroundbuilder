server {
 listen 80;
 server_name backgroundbuilder.duckdns.org;
 location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/backgroundbuilder.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backgroundbuilder.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name backgroundbuilder.duckdns.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /api/compose {
        limit_req zone=api burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location /api/ {

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location /media/ { proxy_pass http://backend:8000; }
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
